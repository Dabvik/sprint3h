<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0A">
<title>Sprint 3H</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:       #0A0A0A;
    --bg2:      #111111;
    --bg3:      #181818;
    --border:   #242424;
    --text:     #F0ECE4;
    --muted:    #555;
    --accent:   #FF5C2E;
    --accent2:  #FFB800;
    --green:    #3DDC84;
    --safe:     env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; height: 100dvh; height: 100vh; max-width: 480px; margin: 0 auto; }

  /* ── Header ── */
  header {
    padding: 52px 20px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { font-family: 'Syne', sans-serif; }
  .brand-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
  .brand-sub { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 1px; }
  .notif-btn {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--bg3); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; transition: all 0.2s;
    flex-shrink: 0;
  }
  .notif-btn.active { border-color: var(--accent); background: #FF5C2E22; }

  /* ── Sprint status bar ── */
  .sprint-bar {
    margin-top: 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .sprint-row { display: flex; justify-content: space-between; align-items: center; }
  .sprint-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .sprint-time { font-size: 13px; color: var(--accent); font-weight: 500; }
  .sprint-countdown { font-size: 24px; font-weight: 500; color: var(--text); letter-spacing: -1px; margin-top: 4px; }
  .sprint-countdown span { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .progress-track {
    height: 3px; background: var(--border); border-radius: 2px; margin-top: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px; transition: width 1s linear;
  }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 0; padding: 0 20px; background: var(--bg); flex-shrink: 0; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; padding: 13px 0; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); background: none; border: none; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.2s;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  /* ── Main scroll area ── */
  main { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
  main::-webkit-scrollbar { display: none; }

  /* ── Task input ── */
  .add-task-box {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px; margin-bottom: 16px;
  }
  .add-task-row { display: flex; gap: 10px; align-items: flex-end; }
  .task-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; resize: none; line-height: 1.5;
    min-height: 40px; max-height: 100px;
  }
  .task-input::placeholder { color: var(--muted); }
  .priority-toggle {
    display: flex; gap: 4px; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .prio-btn {
    flex: 1; padding: 6px 4px; border-radius: 8px; border: 1px solid var(--border);
    background: none; color: var(--muted); font-size: 10px; font-family: inherit;
    letter-spacing: 1px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  }
  .prio-btn.sel-high { background: #FF5C2E22; border-color: var(--accent); color: var(--accent); }
  .prio-btn.sel-mid  { background: #FFB80022; border-color: var(--accent2); color: var(--accent2); }
  .prio-btn.sel-low  { background: #3DDC8422; border-color: var(--green); color: var(--green); }
  .add-btn {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--accent); border: none; color: #000;
    font-size: 22px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s;
  }
  .add-btn:active { transform: scale(0.94); }

  /* ── Section header ── */
  .section-hd {
    font-size: 10px; color: var(--muted); letter-spacing: 2.5px;
    text-transform: uppercase; margin: 6px 0 12px; display: flex;
    justify-content: space-between; align-items: center;
  }
  .badge {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; padding: 2px 8px; font-size: 10px; color: var(--muted);
  }
  .badge.accent { border-color: var(--accent); color: var(--accent); background: #FF5C2E15; }

  /* ── Task card ── */
  .task-card {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 14px 14px 50px;
    margin-bottom: 10px; position: relative;
    transition: all 0.25s; animation: slideIn 0.25s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .task-card.done { opacity: 0.4; }
  .task-card.done .task-text { text-decoration: line-through; color: var(--muted); }
  .task-card.prio-high { border-left: 3px solid var(--accent); }
  .task-card.prio-mid  { border-left: 3px solid var(--accent2); }
  .task-card.prio-low  { border-left: 3px solid var(--green); }

  .check-wrap {
    position: absolute; left: 14px; top: 14px;
    width: 26px; height: 26px;
  }
  .check-circle {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--border); background: none;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .task-card.done .check-circle { background: var(--green); border-color: var(--green); }

  .task-text { font-size: 14px; line-height: 1.5; color: var(--text); word-break: break-word; }
  .task-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .prio-tag {
    font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px;
  }
  .prio-tag.high { color: var(--accent); background: #FF5C2E18; }
  .prio-tag.mid  { color: var(--accent2); background: #FFB80018; }
  .prio-tag.low  { color: var(--green); background: #3DDC8418; }
  .task-time { font-size: 10px; color: var(--muted); }

  .task-actions { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
  .task-act-btn {
    width: 28px; height: 28px; border-radius: 7px;
    background: none; border: 1px solid transparent;
    color: var(--muted); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .task-act-btn:active { background: var(--bg); border-color: var(--border); }

  /* ── Empty state ── */
  .empty {
    text-align: center; padding: 50px 20px;
    color: var(--muted); font-size: 13px; line-height: 2;
  }
  .empty-icon { font-size: 44px; margin-bottom: 12px; }

  /* ── History view ── */
  .history-block {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
  }
  .history-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .history-date { font-size: 12px; color: var(--text); }
  .history-score {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    background: #3DDC8420; color: var(--green); border: 1px solid #3DDC8440;
  }
  .history-task { font-size: 12px; color: var(--muted); padding: 4px 0; display: flex; align-items: center; gap: 8px; }
  .history-task.done-h { color: #3DDC8488; }
  .history-task.done-h::before { content: '✓'; color: var(--green); }
  .history-task.skip-h::before { content: '–'; color: var(--muted); }

  /* ── Notification permission banner ── */
  .notif-banner {
    background: #FF5C2E18; border: 1px solid #FF5C2E44;
    border-radius: 12px; padding: 14px; margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .notif-banner p { font-size: 12px; color: var(--text); line-height: 1.6; }
  .notif-banner-btns { display: flex; gap: 8px; }
  .nbtn {
    flex: 1; padding: 10px; border-radius: 8px; font-family: inherit;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s;
  }
  .nbtn-primary { background: var(--accent); border: none; color: #000; font-weight: 700; }
  .nbtn-secondary { background: none; border: 1px solid var(--border); color: var(--muted); }

  /* ── Settings panel ── */
  .settings-row {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 10px;
  }
  .settings-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .settings-val { font-size: 18px; font-weight: 500; color: var(--text); margin-bottom: 10px; }
  .time-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .time-btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: none; color: var(--muted); font-family: inherit; font-size: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .time-btn.active { background: #FF5C2E22; border-color: var(--accent); color: var(--accent); }
  .custom-start { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .custom-start input[type=time] {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 14px;
    color-scheme: dark;
  }
  .new-sprint-btn {
    width: 100%; padding: 16px; border-radius: 14px;
    background: var(--accent); border: none; color: #000;
    font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800;
    letter-spacing: 0.5px; cursor: pointer; transition: all 0.15s;
    margin-top: 4px;
  }
  .new-sprint-btn:active { transform: scale(0.97); }

  /* ── Bottom padding ── */
  .bottom-space { height: calc(20px + env(safe-area-inset-bottom, 0px)); flex-shrink: 0; }

  /* ── Swipe-to-delete hint ── */
  .swipe-hint { font-size: 10px; color: var(--muted); text-align: center; padding: 8px 0 0; opacity: 0.6; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1E1E1E; border: 1px solid var(--border);
    color: var(--text); padding: 10px 20px; border-radius: 20px;
    font-size: 12px; opacity: 0; pointer-events: none;
    transition: all 0.3s; white-space: nowrap; z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Warning state ── */
  .warning .sprint-countdown { color: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-top">
      <div class="brand">
        <div class="brand-title">⚡ Sprint 3H</div>
        <div class="brand-sub">3-Hour Focus Blocks</div>
      </div>
      <button class="notif-btn" id="notifBtn" onclick="toggleNotifications()" title="Notifications">🔔</button>
    </div>
    <div class="sprint-bar" id="sprintBar">
      <div class="sprint-row">
        <div class="sprint-label">Current Sprint</div>
        <div class="sprint-time" id="sprintTimeRange">—</div>
      </div>
      <div class="sprint-countdown" id="sprintCountdown">—<span>remaining</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showTab('tasks')" id="tab-tasks">Tasks</button>
    <button class="tab" onclick="showTab('history')" id="tab-history">History</button>
    <button class="tab" onclick="showTab('settings')" id="tab-settings">Settings</button>
  </div>

  <main id="main-content">
    <!-- Injected by JS -->
  </main>

  <div class="bottom-space"></div>
</div>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let state = loadState();

function defaultState() {
  const now = new Date();
  return {
    sprintStart: now.toISOString(),
    sprintDurationHours: 3,
    warnMinutesBefore: 30,
    tasks: [],
    history: [],
    notifGranted: false,
    notifEnabled: false,
    nextId: 1,
  };
}

function loadState() {
  try {
    const s = localStorage.getItem('sprint3h');
    return s ? { ...defaultState(), ...JSON.parse(s) } : defaultState();
  } catch { return defaultState(); }
}

function saveState() {
  localStorage.setItem('sprint3h', JSON.stringify(state));
}

/* ══════════════════════════════════════════
   SERVICE WORKER
══════════════════════════════════════════ */
let swReg = null;

async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    swReg = await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
  } catch (e) { console.warn('SW reg failed', e); }
}

function swPost(msg) {
  if (!swReg || !swReg.active) return;
  swReg.active.postMessage(msg);
}

/* ══════════════════════════════════════════
   NOTIFICATIONS
══════════════════════════════════════════ */
async function toggleNotifications() {
  if (!state.notifGranted) {
    await requestNotifPermission();
  } else {
    state.notifEnabled = !state.notifEnabled;
    saveState();
    if (state.notifEnabled) {
      scheduleSprintNotifications();
      showToast('Notifications ON 🔔');
    } else {
      swPost({ type: 'CANCEL_ALL' });
      showToast('Notifications OFF');
    }
    render();
  }
}

async function requestNotifPermission() {
  if (!('Notification' in window)) { showToast('Notifications not supported'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    state.notifGranted = true;
    state.notifEnabled = true;
    saveState();
    scheduleSprintNotifications();
    render();
    showToast('Notifications enabled! 🎉');
  } else {
    showToast('Permission denied — check browser settings');
  }
}

function scheduleSprintNotifications() {
  if (!state.notifEnabled || !state.notifGranted) return;
  swPost({ type: 'CANCEL_ALL' });

  const start = new Date(state.sprintStart);
  const durationMs = state.sprintDurationHours * 3600 * 1000;
  const warnMs = state.warnMinutesBefore * 60 * 1000;
  const now = Date.now();

  // Schedule for next 3 sprints
  for (let i = 0; i < 3; i++) {
    const sprintEnd = new Date(start.getTime() + durationMs * (i + 1));
    const warnTime = new Date(sprintEnd.getTime() - warnMs);
    const endTime = sprintEnd;

    const warnDelay = warnTime.getTime() - now;
    const endDelay = endTime.getTime() - now;

    if (warnDelay > 0) {
      const done = state.tasks.filter(t => t.done).length;
      const total = state.tasks.length;
      swPost({
        type: 'SCHEDULE_NOTIF',
        payload: {
          id: `warn-${i}`,
          delayMs: warnDelay,
          title: `⚡ Plan your next 3-hour sprint`,
          body: `${state.warnMinutesBefore} min left! Sprint ${i+1} ends at ${fmt(sprintEnd)}. ${total>0?`You've done ${done}/${total} tasks.`:''} Start planning now.`,
          tag: `sprint-warn-${i}`,
        }
      });
    }

    if (endDelay > 0) {
      swPost({
        type: 'SCHEDULE_NOTIF',
        payload: {
          id: `end-${i}`,
          delayMs: endDelay,
          title: `🏁 Sprint ${i+1} complete!`,
          body: `Time to review your tasks and lock in the next sprint. Tap to open.`,
          tag: `sprint-end-${i}`,
        }
      });
    }
  }
}

function fmt(d) {
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

/* ══════════════════════════════════════════
   SPRINT TIMER
══════════════════════════════════════════ */
let timerInterval = null;

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
  tickTimer();
}

function tickTimer() {
  const start = new Date(state.sprintStart);
  const durationMs = state.sprintDurationHours * 3600 * 1000;
  const now = Date.now();
  const elapsed = now - start.getTime();
  const remaining = durationMs - (elapsed % durationMs);
  const progress = ((elapsed % durationMs) / durationMs) * 100;

  const sprintNum = Math.floor(elapsed / durationMs);
  const sprintStartTime = new Date(start.getTime() + sprintNum * durationMs);
  const sprintEndTime = new Date(sprintStartTime.getTime() + durationMs);

  const h = Math.floor(remaining / 3600000);
  const m = Math.floor((remaining % 3600000) / 60000);
  const s = Math.floor((remaining % 60000) / 1000);

  const el = document.getElementById('sprintCountdown');
  const range = document.getElementById('sprintTimeRange');
  const fill = document.getElementById('progressFill');
  const bar = document.getElementById('sprintBar');

  if (el) {
    el.innerHTML = `${pad(h)}:${pad(m)}:${pad(s)}<span>remaining</span>`;
  }
  if (range) range.textContent = `${fmt(sprintStartTime)} – ${fmt(sprintEndTime)}`;
  if (fill) fill.style.width = progress + '%';

  const isWarning = remaining <= state.warnMinutesBefore * 60000;
  if (bar) bar.classList.toggle('warning', isWarning);
}

function pad(n) { return String(n).padStart(2, '0'); }

/* ══════════════════════════════════════════
   TABS
══════════════════════════════════════════ */
let currentTab = 'tasks';

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab)?.classList.add('active');
  renderMain();
}

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
function render() {
  renderHeader();
  renderMain();
}

function renderHeader() {
  const btn = document.getElementById('notifBtn');
  if (!btn) return;
  btn.classList.toggle('active', state.notifEnabled);
  btn.textContent = state.notifEnabled ? '🔔' : '🔕';
}

function renderMain() {
  const main = document.getElementById('main-content');
  if (!main) return;
  if (currentTab === 'tasks') main.innerHTML = renderTasks();
  else if (currentTab === 'history') main.innerHTML = renderHistory();
  else if (currentTab === 'settings') main.innerHTML = renderSettings();
  bindEvents();
}

function renderTasks() {
  const pending = state.tasks.filter(t => !t.done);
  const done = state.tasks.filter(t => t.done);
  const needPermission = !state.notifGranted;

  return `
    ${needPermission ? `
    <div class="notif-banner">
      <p>⚡ Enable notifications to get a <strong>30-min warning</strong> before each sprint ends — so you can plan ahead.</p>
      <div class="notif-banner-btns">
        <button class="nbtn nbtn-primary" onclick="requestNotifPermission()">Enable Alerts</button>
        <button class="nbtn nbtn-secondary" onclick="dismissNotifBanner()">Not now</button>
      </div>
    </div>
    ` : ''}

    <div class="add-task-box">
      <div class="add-task-row">
        <textarea class="task-input" id="taskInput" placeholder="What needs to get done this sprint?" rows="2" onkeydown="handleTaskKey(event)"></textarea>
        <button class="add-btn" onclick="addTask()">+</button>
      </div>
      <div class="priority-toggle">
        <button class="prio-btn" id="prio-high" onclick="selectPrio('high')">🔴 High</button>
        <button class="prio-btn" id="prio-mid" onclick="selectPrio('mid')">🟡 Med</button>
        <button class="prio-btn" id="prio-low" onclick="selectPrio('low')">🟢 Low</button>
      </div>
    </div>

    ${pending.length === 0 && done.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">📋</div>
        No tasks yet.<br>Add what you want to<br>accomplish this sprint.
      </div>
    ` : ''}

    ${pending.length > 0 ? `
      <div class="section-hd">
        <span>To Do</span>
        <span class="badge accent">${pending.length}</span>
      </div>
      ${pending.map(t => taskCard(t)).join('')}
    ` : ''}

    ${done.length > 0 ? `
      <div class="section-hd" style="margin-top:20px">
        <span>Completed</span>
        <span class="badge">${done.length}</span>
      </div>
      ${done.map(t => taskCard(t)).join('')}
    ` : ''}

    ${state.tasks.length > 0 ? `<p class="swipe-hint">Tap ✓ to complete · × to remove</p>` : ''}
  `;
}

function taskCard(t) {
  return `
    <div class="task-card ${t.done ? 'done' : ''} prio-${t.prio}" id="card-${t.id}">
      <div class="check-wrap">
        <div class="check-circle" onclick="toggleTask(${t.id})">${t.done ? '✓' : ''}</div>
      </div>
      <div class="task-text">${escHtml(t.text)}</div>
      <div class="task-meta">
        <span class="prio-tag ${t.prio}">${t.prio === 'high' ? '🔴 High' : t.prio === 'mid' ? '🟡 Med' : '🟢 Low'}</span>
        <span class="task-time">${t.addedAt}</span>
      </div>
      <div class="task-actions">
        <button class="task-act-btn" onclick="removeTask(${t.id})">×</button>
      </div>
    </div>
  `;
}

function renderHistory() {
  if (state.history.length === 0) return `
    <div class="empty">
      <div class="empty-icon">📂</div>
      No history yet.<br>Complete a sprint to<br>see your progress here.
    </div>
  `;

  return state.history.slice().reverse().map(sprint => {
    const done = sprint.tasks.filter(t => t.done).length;
    const total = sprint.tasks.length;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    return `
      <div class="history-block">
        <div class="history-hd">
          <div class="history-date">📅 ${sprint.label}</div>
          <div class="history-score">${done}/${total} · ${pct}%</div>
        </div>
        ${sprint.tasks.map(t => `
          <div class="history-task ${t.done ? 'done-h' : 'skip-h'}">${escHtml(t.text)}</div>
        `).join('')}
      </div>
    `;
  }).join('');
}

function renderSettings() {
  return `
    <div class="settings-row">
      <div class="settings-label">Sprint Duration</div>
      <div class="settings-val">${state.sprintDurationHours} hour${state.sprintDurationHours > 1 ? 's' : ''}</div>
      <div class="time-btns">
        ${[1,2,3,4].map(h => `
          <button class="time-btn ${state.sprintDurationHours === h ? 'active' : ''}" onclick="setDuration(${h})">${h}h</button>
        `).join('')}
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-label">Warning Before Sprint Ends</div>
      <div class="settings-val">${state.warnMinutesBefore} min before</div>
      <div class="time-btns">
        ${[15,20,30,45].map(m => `
          <button class="time-btn ${state.warnMinutesBefore === m ? 'active' : ''}" onclick="setWarn(${m})">${m}m</button>
        `).join('')}
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-label">Sprint Start Time</div>
      <div class="custom-start">
        <input type="time" id="startTimeInput" value="${toTimeInput(state.sprintStart)}">
        <button class="time-btn active" onclick="setStartTime()">Set</button>
      </div>
    </div>

    <button class="new-sprint-btn" onclick="newSprint()">
      ⚡ Start New Sprint Now
    </button>

    <div style="margin-top:20px">
      <div class="settings-row" style="cursor:pointer" onclick="exportData()">
        <div class="settings-label">Export / Backup</div>
        <div style="font-size:13px;color:var(--muted)">Download all data as JSON →</div>
      </div>
    </div>

    <div style="margin-top:10px; padding:16px; text-align:center; font-size:10px; color:var(--muted); letter-spacing:1px">
      SPRINT 3H · YOUR DATA STAYS ON DEVICE
    </div>
  `;
}

/* ══════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════ */
let selectedPrio = 'high';

function selectPrio(p) {
  selectedPrio = p;
  ['high','mid','low'].forEach(x => {
    const btn = document.getElementById('prio-' + x);
    if (btn) btn.className = `prio-btn${x === p ? ' sel-' + x : ''}`;
  });
}

function handleTaskKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    addTask();
  }
}

function addTask() {
  const inp = document.getElementById('taskInput');
  const text = inp?.value?.trim();
  if (!text) return;

  state.tasks.push({
    id: state.nextId++,
    text,
    prio: selectedPrio,
    done: false,
    addedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
  });
  saveState();
  if (inp) inp.value = '';
  renderMain();
  showToast('Task added ✓');
}

function toggleTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (t) { t.done = !t.done; saveState(); renderMain(); }
}

function removeTask(id) {
  state.tasks = state.tasks.filter(x => x.id !== id);
  saveState();
  renderMain();
}

function dismissNotifBanner() {
  state.notifGranted = true; // pretend granted so banner hides
  state.notifEnabled = false;
  saveState();
  renderMain();
}

function setDuration(h) {
  state.sprintDurationHours = h;
  saveState();
  scheduleSprintNotifications();
  renderMain();
}

function setWarn(m) {
  state.warnMinutesBefore = m;
  saveState();
  scheduleSprintNotifications();
  renderMain();
}

function setStartTime() {
  const inp = document.getElementById('startTimeInput');
  if (!inp) return;
  const [hh, mm] = inp.value.split(':').map(Number);
  const d = new Date();
  d.setHours(hh, mm, 0, 0);
  state.sprintStart = d.toISOString();
  saveState();
  scheduleSprintNotifications();
  showToast('Sprint start time updated');
}

function toTimeInput(iso) {
  const d = new Date(iso);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function newSprint() {
  // Archive current tasks to history
  if (state.tasks.length > 0) {
    const start = new Date(state.sprintStart);
    state.history.push({
      label: `${start.toLocaleDateString()} ${fmt(start)}`,
      tasks: state.tasks.map(t => ({ ...t })),
    });
    if (state.history.length > 20) state.history.shift();
  }

  state.tasks = [];
  state.sprintStart = new Date().toISOString();
  saveState();
  scheduleSprintNotifications();
  showTab('tasks');
  showToast('New sprint started! ⚡');
}

function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sprint3h-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function bindEvents() {
  // re-apply selected prio styling after re-render
  ['high','mid','low'].forEach(x => {
    const btn = document.getElementById('prio-' + x);
    if (btn && x === selectedPrio) btn.className = `prio-btn sel-${x}`;
  });
}

/* ══════════════════════════════════════════
   TOAST
══════════════════════════════════════════ */
let toastTimeout;
function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 2500);
}

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
async function init() {
  await registerSW();
  if (state.notifGranted && Notification.permission === 'granted') {
    state.notifEnabled = true;
    scheduleSprintNotifications();
  }
  render();
  startTimer();
}

init();
</script>
</body>
</html>
